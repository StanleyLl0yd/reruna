name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
