name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37.0
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify canonical icon
        run: |
          test "$(sha256sum assets/branding/reruna-icon.png | cut -d' ' -f1)" = "5ecf527eb8a01550cce8949a66c3d68d77e716acdd12f2d887f09eee677f579b"
          cmp -s assets/branding/reruna-icon.png app/src/main/res/mipmap-nodpi/ic_launcher.png

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon :app:lintDebug

      - name: Build debug artifacts
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload debug artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reruna-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
