name: Publish R0

on:
  push:
    branches: [main]
    paths:
      - '.github/release-notes/R0.md'

permissions: {}

concurrency:
  group: publish-r0
  cancel-in-progress: false

env:
  RELEASE_TAG: R0

jobs:
  validate:
    name: Validate R0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify CI supply-chain policy
        run: python3 scripts/verify_ci_supply_chain.py

      - name: Validate R0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          namespace="$(sed -n 's/^[[:space:]]*namespace = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          application_id="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"

          test "$namespace" = "com.sl.reruna"
          test "$application_id" = "com.sl.reruna"
          test "$version_name" = "0.1.0"
          test "$version_code" = "1"
          test -f ".github/release-notes/$RELEASE_TAG.md"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Require successful main verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required_workflows=("Android CI" "Security" "CodeQL")

          for attempt in $(seq 1 40); do
            runs="$(gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2026-03-10"               "/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
            pending=0

            for workflow_name in "${required_workflows[@]}"; do
              record="$(jq -c --arg name "$workflow_name"                 '[.workflow_runs[] | select(.name == $name and .event == "push" and .head_branch == "main")] | sort_by(.created_at) | last // empty'                 <<< "$runs")"

              if [[ -z "$record" ]]; then
                echo "$workflow_name: waiting for main push run"
                pending=1
                continue
              fi

              status="$(jq -r '.status' <<< "$record")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$record")"
              run_url="$(jq -r '.html_url' <<< "$record")"

              if [[ "$status" != "completed" ]]; then
                echo "$workflow_name: $status ($run_url)"
                pending=1
              elif [[ "$conclusion" != "success" ]]; then
                echo "$workflow_name failed with conclusion '$conclusion': $run_url" >&2
                exit 1
              else
                echo "$workflow_name: success ($run_url)"
              fi
            done

            if (( pending == 0 )); then
              exit 0
            fi

            if (( attempt < 40 )); then
              sleep 15
            fi
          done

          echo "Timed out waiting for required main verification workflows." >&2
          exit 1

  build:
    name: Build and attest R0
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android API 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Test and lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build development APK and AAB
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug --stacktrace

      - name: Verify and package artifacts
        id: package
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          source_aab="app/build/outputs/bundle/debug/app-debug.aab"
          test -s "$source_apk"
          test -s "$source_aab"

          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$aapt"
          package_name="$("$aapt" dump badging "$source_apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$package_name" = "com.sl.reruna"

          mkdir -p release
          apk_path="release/RERUNA-R0-debug.apk"
          aab_path="release/RERUNA-R0-debug.aab"
          checksum_path="release/RERUNA-R0.sha256"
          cp "$source_apk" "$apk_path"
          cp "$source_aab" "$aab_path"

          (
            cd release
            sha256sum "RERUNA-R0-debug.apk" "RERUNA-R0-debug.aab" > "RERUNA-R0.sha256"
            sha256sum --check "RERUNA-R0.sha256"
          )

          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "aab_path=$aab_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Attest Android artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.aab_path }}

      - name: Upload verified R0 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reruna-r0
          path: |
            ${{ steps.package.outputs.apk_path }}
            ${{ steps.package.outputs.aab_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish R0
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified R0 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: reruna-r0
          path: release

      - name: Create immutable release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api             --method POST             "/repos/$GITHUB_REPOSITORY/git/refs"             -f ref="refs/tags/$RELEASE_TAG"             -f sha="$GITHUB_SHA" >/dev/null
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG"             --verify-tag             --draft             --prerelease             --title "RERUNA R0 — Foundation"             --notes-file ".github/release-notes/$RELEASE_TAG.md"             --repo "$GITHUB_REPOSITORY"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Attach verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG"             "release/RERUNA-R0-debug.apk"             "release/RERUNA-R0-debug.aab"             "release/RERUNA-R0.sha256"             --repo "$GITHUB_REPOSITORY"

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"

      - name: Remove failed draft
        if: failure() && steps.draft.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$RELEASE_TAG" --yes --repo "$GITHUB_REPOSITORY" || true

      - name: Remove failed tag
        if: failure() && steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method DELETE "/repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
