name: Bootstrap dependency locks

on:
  push:
    branches: [security/additional-checks]

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Android build environment
        uses: ./.github/actions/android-gradle-setup
        with:
          gradle-cache-read-only: true

      - name: Install Android API 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Generate dependency locks
        run: |
          set -euo pipefail
          gradle --no-daemon --no-configuration-cache :app:dependencies --write-locks >/dev/null
          test -s app/gradle.lockfile
          echo '---RERUNA-LOCKFILE-BEGIN---'
          cat app/gradle.lockfile
          echo '---RERUNA-LOCKFILE-END---'
