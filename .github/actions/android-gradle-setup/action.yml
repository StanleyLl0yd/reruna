name: Android Gradle setup
description: Configure JDK, Android SDK tools, Gradle cache, and a checksum-pinned Gradle distribution

inputs:
  android-packages:
    description: Packages installed by setup-android
    required: false
    default: platform-tools
  gradle-cache-read-only:
    description: Whether the Gradle cache is read-only
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      with:
        packages: ${{ inputs.android-packages }}

    - name: Set up Gradle cache
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-provider: basic
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    - name: Install checksum-pinned Gradle 9.6.0
      shell: bash
      run: |
        set -euo pipefail
        version="9.6.0"
        expected_sha256="bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01"
        archive="$RUNNER_TEMP/gradle-$version-bin.zip"
        install_root="$RUNNER_TEMP/gradle-dist"

        curl           --fail           --location           --proto '=https'           --retry 3           --show-error           --silent           --tlsv1.2           "https://services.gradle.org/distributions/gradle-$version-bin.zip"           --output "$archive"

        printf '%s  %s\n' "$expected_sha256" "$archive" | sha256sum --check --strict

        rm -rf "$install_root"
        mkdir -p "$install_root"
        unzip -q "$archive" -d "$install_root"
        echo "$install_root/gradle-$version/bin" >> "$GITHUB_PATH"
